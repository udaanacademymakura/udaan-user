<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zoom Meeting</title>
    <link type="text/css" rel="stylesheet" href="https://source.zoom.us/6.2.0/css/bootstrap.css" />
    <link type="text/css" rel="stylesheet" href="https://source.zoom.us/6.2.0/css/react-select.css" />
</head>

<body>
    <style>
        html,
        body {
            height: 100%;
            width: 100%;
            margin: 0;
            background-color: black;
            overflow: hidden;
        }

        #zmmtg-root {
            width: 100%;
            height: 100%;
            display: block;
        }
    </style>

    <div id="zmmtg-root"></div>

    <script src="https://source.zoom.us/6.2.0/lib/vendor/react.min.js"></script>
    <script src="https://source.zoom.us/6.2.0/lib/vendor/react-dom.min.js"></script>
    <script src="https://source.zoom.us/6.2.0/lib/vendor/redux.min.js"></script>
    <script src="https://source.zoom.us/6.2.0/lib/vendor/redux-thunk.min.js"></script>
    <script src="https://source.zoom.us/6.2.0/lib/vendor/lodash.min.js"></script>
    <script src="https://source.zoom.us/zoom-meeting-6.2.0.min.js"></script>

    <script>
        ZoomMtg.preLoadWasm();
        ZoomMtg.prepareWebSDK();
        // chat - item - container
        const urlParams = new URLSearchParams(window.location.search);
        const meetingConfig = {
            mn: urlParams.get('mn'),
            pwd: urlParams.get('pwd'),
            sig: urlParams.get('sig'),
            key: urlParams.get('key'),
            name: urlParams.get('name'),
            email: urlParams.get('email'),
            leaveUrl: urlParams.get('leave')
        };

        const post = (payload) => {
            try {
                parent.postMessage(Object.assign({ type: 'udaan_zoom' }, payload), window.location.origin);
            } catch (e) { }
        };

        const postFailure = (at, res) => {
            console.error('Zoom ' + at + ' error:', res);
            post({
                stage: 'error',
                at: at,
                errorCode: (res && res.errorCode) || 0,
                detail: (res && (res.result || res.reason || res.message)) || ''
            });
        };

        if (meetingConfig.mn && meetingConfig.sig) {
            ZoomMtg.init({
                leaveUrl: meetingConfig.leaveUrl,
                isSupportAV: true,
                showMeetingHeader: true,
                disableJoinAudio: false,
                disableRecord: true,
                // isSupportChat: false,
                audioPanelAlwaysOpen: false,
                success: function () {
                    post({ stage: 'audio_connecting' });
                    const joinConfig = {
                        meetingNumber: meetingConfig.mn,
                        userName: meetingConfig.name,
                        signature: meetingConfig.sig,
                        sdkKey: meetingConfig.key,
                        passWord: meetingConfig.pwd,
                        success: function (res) {
                            ZoomMtg.mute({
                                mute: true
                            });
                            post({ stage: 'joined' });
                            const style = document.createElement('style');

                            style.innerHTML = `
                                .meeting-info-container__wrapper,
                                .meeting-info-container__full-screen,
                                .footer__panel, 
                                .header-bar__container,                               
                                #participant,
                                .notification-message-wrap__layer,
                                #notificationManager {
                                    display: none !important;
                                }

                                .join-audio-container,
                                .audio-control-item,
                                .mute-button,
                                button[aria-label^="mute"],
                                button[aria-label^="unmute"] ,#app-signal,
                                #foot-bar > div > div.footer-button__wrapper:nth-child(1){
                                    display: none !important;
                                }

                               .dropdown-menu > div:nth-child(1) , .preview-agreement{
                                    display: none !important;
                                }
                            `;
                            document.head.appendChild(style);
                        },
                        error: function (res) {
                            postFailure('join', res);
                        }
                    };

                    ZoomMtg.join(joinConfig);
                },
                error: function (res) {
                    postFailure('init', res);
                }
            });
        } else {
            postFailure('config', { message: 'Meeting number or signature missing.' });
        }
    </script>
</body>

</html>
